<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil — Skotaz Modding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rouge: #E8212B;
            --bleu: #003F8A;
            --bleu-clair: #1A6FC4;
            --or: #F5C518;
            --blanc: #F4F6FA;
            --gris-clair: #E8EBF0;
            --gris: #8A95A3;
            --fond: #0D1117;
            --fond2: #141B24;
            --fond3: #1C2535;
            --bordure: rgba(255,255,255,0.07);
            --vert: #28C76F;
            --cyan: #17A2B8;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            scrollbar-width: thin;
            scrollbar-color: var(--bleu) var(--fond2);
        }
        html::-webkit-scrollbar { width: 6px; }
        html::-webkit-scrollbar-track { background: var(--fond2); }
        html::-webkit-scrollbar-thumb { background: var(--bleu); border-radius: 3px; }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--fond);
            color: var(--blanc);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13,17,23,0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--bordure);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 64px;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--blanc);
            text-decoration: none;
        }
        .topbar-brand-dot {
            width: 8px; height: 8px;
            background: var(--rouge);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--rouge);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px var(--rouge); }
            50% { box-shadow: 0 0 16px var(--rouge), 0 0 32px rgba(232,33,43,0.4); }
        }
        .topbar-badge {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 4px;
            background: rgba(0,63,138,0.25);
            color: #6FA8FF;
            border: 1px solid rgba(0,63,138,0.5);
        }

        .hero {
            position: relative;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 60px 20px;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to bottom, rgba(13,17,23,0.55) 0%, rgba(13,17,23,0.92) 100%),
                url('https://i.postimg.cc/4NWpXqrB/image-2026-08-23-191811635.png');
            background-size: cover;
            background-position: center 30%;
            filter: saturate(0.6);
        }
        .hero-noise {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
        }
        .hero-stripe {
            position: absolute;
            left: 0; right: 0;
            height: 3px;
            display: flex;
        }
        .hero-stripe.top { top: 0; }
        .hero-stripe.bottom { bottom: 0; }
        .hero-stripe span { flex: 1; }
        .hero-stripe span:nth-child(1) { background: #002395; }
        .hero-stripe span:nth-child(2) { background: #EDEDED; }
        .hero-stripe span:nth-child(3) { background: #ED2939; }

        .hero-content {
            position: relative;
            text-align: center;
            max-width: 780px;
        }
        .hero-eyebrow {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gris);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .hero-eyebrow::before, .hero-eyebrow::after {
            content: '';
            width: 40px; height: 1px;
            background: linear-gradient(to right, transparent, var(--gris));
        }
        .hero-eyebrow::after { transform: scaleX(-1); }
        .hero-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 800;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 16px;
        }
        .hero-title em {
            font-style: normal;
            color: var(--rouge);
        }
        .hero-subtitle {
            font-size: 1.05rem;
            font-weight: 300;
            color: rgba(244,246,250,0.65);
            margin-bottom: 36px;
            letter-spacing: 0.5px;
        }

        .btn-hero {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #C41826 0%, #8B0F1A 100%);
            color: #fff;
            padding: 16px 40px;
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 30px rgba(196,24,38,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-hero::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transition: left 0.5s ease;
        }
        .btn-hero:hover::before { left: 100%; }
        .btn-hero:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(196,24,38,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-hero-meta {
            display: block;
            font-family: 'Barlow', sans-serif;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .btn-secondary { display:inline-flex; align-items:center; gap:10px; padding:12px 22px; background:rgba(23,162,184,0.1); border:1px solid rgba(23,162,184,0.35); border-radius:5px; color:#5BC8D8; font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:2px; text-transform:uppercase; text-decoration:none; margin:0; }
        .main-wrap { max-width:1200px; margin:0 auto; padding:40px 20px 80px; }
        .cards { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; align-items:stretch; }
        .card { background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); border:1px solid var(--bordure); padding:18px; border-radius:12px; width:calc((100% - 36px) / 3); min-width:260px; text-align:left; overflow:hidden; transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease; box-shadow: 0 12px 30px rgba(0,0,0,0.18); display:flex; flex-direction:column; }
        .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.12); box-shadow: 0 18px 40px rgba(0,0,0,0.26); }
        .card-image { display:block; width:100%; aspect-ratio:16 / 9; height:auto; object-fit:cover; border-radius:8px; margin-bottom:14px; border:1px solid rgba(255,255,255,0.06); background:#111827; }
        .card-body { display:flex; flex-direction:column; flex:1; }
        .card h3 { font-family:'Barlow Condensed',sans-serif; margin:0 0 8px; font-size:1.15rem; letter-spacing:0.5px; text-align:center; }
        .card p { color: rgba(244,246,250,0.76); line-height:1.5; margin:0 0 12px; }
        .card-badge { display:inline-flex; align-items:center; justify-content:center; width:fit-content; margin:0 auto 12px; padding:5px 12px; border-radius:4px; background:rgba(232,33,43,0.16); border:1px solid rgba(232,33,43,0.6); color:#ffb1b7; font-family:'Barlow Condensed',sans-serif; font-size:0.72rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04); }
        .card-link { display:none; }
        .card { text-decoration:none; color:inherit; }
        .card:hover { text-decoration:none; }
        .card:focus-visible { outline: 2px solid rgba(23,162,184,0.9); outline-offset: 3px; }
        .footer-wrap { border-top:1px solid var(--bordure); padding:28px 20px; text-align:center; color:rgba(255,255,255,0.55); }
        @media (max-width:980px) { .card { width:calc((100% - 18px) / 2); } }
        @media (max-width:720px) { .cards { flex-direction:column; align-items:center; } .card { width:100%; max-width:420px; min-width:unset; } .card-image { aspect-ratio:16 / 9; } }
    </style>
</head>
<body>

<!-- Barre de navigation -->
<nav class="topbar">
    <a class="topbar-brand" href="/">
        <span class="topbar-brand-dot"></span>
        Skotaz Modding
    </a>
    <span class="topbar-badge">Accueil</span>
</nav>

    <header class="hero">

        <div class="hero-content">
            <h1 class="hero-title">Skotaz Modding</h1>
            <p class="hero-subtitle"></p>
        </div>
    </header>

    <main class="main-wrap">
        <div class="cards">
            <a class="card" href="/pack-eup" aria-label="Ouvrir Pack EUP | Secours Français">
                <img class="card-image" src="https://i.ibb.co/67MNFpMf/image-2026-08-19-134650505.png" alt="Pack EUP — Secours Français">

                    <h3>Pack EUP | Secours Français</h3>

            <a class="card" href="/bspp-ps6g" aria-label="Ouvrir Renault D12 PS6G | BSPP">
                <img class="card-image" src="https://i.postimg.cc/jx2Hpnkt/GTA5-2026-05-31-20-06.png" alt="PS6G — BSPP">
                <div class="card-body">
                    <h3>Renault D12 PS6G | BSPP</h3>
                    <div class="card-badge">Gratuit</div>
                </div>
            </a>
            <a class="card" href="/bspp-pma" aria-label="Ouvrir Renault D12 PMA | BSPP">
                <img class="card-image" src="https://i.postimg.cc/RCLL6mCj/image-2026-08-23-111941474.png" alt="PMA — BSPP">
                <div class="card-body">
                    <h3>Renault D12 PMA | BSPP</h3>
                    <div class="card-badge">Gratuit</div>
                </div>
            </a>
            <a class="card" href="/gn-rs3" aria-label="Ouvrir Audi RS3 | GN">
                <img class="card-image" src="https://i.postimg.cc/5NVxKty1/image-2026-08-23-185003033.png" alt="RS3 — GN">
                <div class="card-body">
                    <h3>Audi RS3 | GN</h3>
                    <div class="card-badge">Gratuit</div>
                </div>
            </a>
            <a class="card" href="/sc-nrbce" aria-label="Ouvrir Audi RS3 | GN">
                <img class="card-image" src="https://i.postimg.cc/vHhCb8Yp/image-2026-08-23-193118799.png" alt="RS3 — GN">
                <div class="card-body">
                    <h3>Renault Master NRBCE | SC</h3>
                    <div class="card-badge">Gratuit</div>
                </div>
            </a>
        </div>
    </main>

    <footer class="footer-wrap">
        <div style="max-width:900px;margin:0 auto;">© Skotaz Modding — Tous droits réservés</div>
    </footer>
</body>
</html>
